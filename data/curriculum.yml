      - MOD-11

  - id: DOMAIN-09
    order: 9
    title: Μετάδοση και τηλεπικοινωνίες
    guiding_question: Πώς μεταφέρεται φυσικά ένα σήμα και πώς λειτουργούν τα τηλεπικοινωνιακά δίκτυα;
    module_ids:
