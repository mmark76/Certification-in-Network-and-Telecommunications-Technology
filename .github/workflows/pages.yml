name: Deploy educational website to GitHub Pages

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate deployment build information
        env:
          TZ: Europe/Athens
        run: |
          BUILD_STAMP="$(date +'%Y%m%d_%H%M')"
          SHORT_SHA="${GITHUB_SHA::7}"
          cat > assets/build-info.js <<EOF
          window.NTT_BUILD_INFO = Object.freeze({
            version: '0.1.0',
            buildStamp: '${BUILD_STAMP}',
            shortSha: '${SHORT_SHA}'
          });
          EOF

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
